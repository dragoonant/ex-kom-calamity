# PLAN.md D12: every push to main rebuilds the playtest on GitHub Pages (branch gh-pages, served as is).
# The build is the gate it can afford in a minute or two: typecheck (inside `npm run build`), the unit tests and the
# data check. The browser e2e, sims and the AI bench stay the per-commit gates of CLAUDE.md, run before merging.
# The new build is committed on top of gh-pages (no force push), so earlier builds stay in its history.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          path: src

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install, test and build
        working-directory: src
        run: |
          npm ci
          npm test
          npm run validate:data
          npm run build

      - name: Check out gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      - name: Commit the build to gh-pages
        working-directory: pages
        run: |
          git rm -rq --ignore-unmatch .
          cp -r ../src/dist/. .
          touch .nojekyll
          git add -A
          if git diff --cached --quiet; then
            echo "The build is unchanged; nothing to deploy."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Pages build of main ${GITHUB_SHA::7}: $(git -C ../src log -1 --format=%s | cut -c1-100)"
          git push origin gh-pages
